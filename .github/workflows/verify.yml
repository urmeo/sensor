name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - run: python -m pytest tests/ -q
      - run: python -m scripts.derive --check
      - run: python -m scripts.validate_provenance
      - run: python -m pytest --nbmake --nbmake-timeout=600 notebooks/explore_data.ipynb
        env:
          MPLBACKEND: Agg
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy sensor_data.py scripts
        if: matrix.python == '3.11'
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Generate report figures
        run: |
          mkdir -p outputs/site
          cp docs/index.html outputs/site/index.html
          python -m scripts.export_figures --output-dir outputs/site/figures
        env:
          MPLBACKEND: Agg
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: outputs/site
      - name: Publish charts
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
